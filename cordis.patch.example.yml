# Example config override for the row dsh-tokbook's own bundle patch inserts
# (id: tokbook). Install or select the bundle first, then append this to
# $DSH_HOME/profiles/<profile>/cordis.patch.yml only when you want to change
# a config key.
#
# `config` is replaced wholesale, so restate every key you want to keep.
- id: tokbook
  config:
    path: D:/data/tokbook
    recordCompaction: true
    plans:
      opencode-go:
        enabled: false
